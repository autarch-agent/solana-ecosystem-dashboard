name: hourly-report

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch: {}    # manual runs

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate report (stdlib only, no deps)
        run: python generate_report.py

      - name: Commit refreshed snapshot
        run: |
          git config user.name  "solana-eco-bot"
          git config user.email "actions@users.noreply.github.com"
          git add REPORT.md
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "report refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
